version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor stay mergeable even if a major bump conflicts the lockfile.
      storyboard-os-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      storyboard-os-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions-deps:
        patterns:
          - "*"
