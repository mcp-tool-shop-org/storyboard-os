name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @storyboard-os/core build
          pnpm --filter @storyboard-os/routing build
          pnpm --filter @storyboard-os/rpg-domain build
          pnpm --filter @storyboard-os/canvas build
          pnpm --filter @storyboard-os/marketing-domain build

      - name: Run tests
        run: pnpm test

      - name: Build app
        run: pnpm build
