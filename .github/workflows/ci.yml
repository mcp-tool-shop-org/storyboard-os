name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'site/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Typecheck apps
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Build app
        run: pnpm build
