name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'site/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Must match package.json packageManager (pnpm@11.4.0). A bare
      # `version: 11` is rejected as a mismatch; omitting version lets
      # action-setup self-install 11.7 then switch, which can leave PATH
      # on 11.7 for `pnpm install --frozen-lockfile`.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build packages
        run: pnpm run build:packages

      - name: Packed-tarball contents proof
        run: pnpm run pack:smoke

      - name: Typecheck packages + apps
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Build app
        run: pnpm build

      - name: Build site
        run: pnpm --filter site build

      - name: Assert site dist artifacts
        run: pnpm run check:site-dist
