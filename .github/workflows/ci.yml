name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'site/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'atlas/**'
      # Codecov reads its status and comment settings from this file.
      - 'codecov.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 'true' on a pull request or a push to the default branch, the runs
      # whose coverage and test results go to Codecov.
      COVERAGE_LEG: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match package.json packageManager (pnpm@11.4.0). A bare
      # `version: 11` is rejected as a mismatch; omitting version lets
      # action-setup self-install 11.7 then switch, which can leave PATH
      # on 11.7 for `pnpm install --frozen-lockfile`.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build packages
        run: pnpm run build:packages

      - name: Packed-tarball contents proof
        run: pnpm run pack:smoke

      - name: Typecheck packages + apps
        run: pnpm run check

      - name: Run tests
        id: tests
        run: pnpm test

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: |
            apps/cinematic-storyboard/coverage/lcov.info
            apps/marketing-storyboard/coverage/lcov.info
            apps/rpg-storyboard/coverage/lcov.info
            packages/storyboard-routing/coverage/lcov.info
            packages/storyboard-core/coverage/lcov.info
            packages/storyboard-canvas/coverage/lcov.info
            packages/cinematic-storyboard-domain/coverage/lcov.info
            packages/marketing-storyboard-domain/coverage/lcov.info
            packages/rpg-storyboard-domain/coverage/lcov.info
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: |
            apps/cinematic-storyboard/junit.xml
            apps/marketing-storyboard/junit.xml
            apps/rpg-storyboard/junit.xml
            packages/storyboard-routing/junit.xml
            packages/storyboard-core/junit.xml
            packages/storyboard-canvas/junit.xml
            packages/cinematic-storyboard-domain/junit.xml
            packages/marketing-storyboard-domain/junit.xml
            packages/rpg-storyboard-domain/junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Build app
        run: pnpm build

      - name: Build site
        run: pnpm --filter site build

      - name: Assert site dist artifacts
        run: pnpm run check:site-dist

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: verify
    if: ${{ !cancelled() && needs.verify.result != 'cancelled' && needs.verify.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: .

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('apps/cinematic-storyboard/coverage/lcov.info', 'apps/marketing-storyboard/coverage/lcov.info', 'apps/rpg-storyboard/coverage/lcov.info', 'packages/storyboard-routing/coverage/lcov.info', 'packages/storyboard-core/coverage/lcov.info', 'packages/storyboard-canvas/coverage/lcov.info', 'packages/cinematic-storyboard-domain/coverage/lcov.info', 'packages/marketing-storyboard-domain/coverage/lcov.info', 'packages/rpg-storyboard-domain/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./apps/cinematic-storyboard/coverage/lcov.info,./apps/marketing-storyboard/coverage/lcov.info,./apps/rpg-storyboard/coverage/lcov.info,./packages/storyboard-routing/coverage/lcov.info,./packages/storyboard-core/coverage/lcov.info,./packages/storyboard-canvas/coverage/lcov.info,./packages/cinematic-storyboard-domain/coverage/lcov.info,./packages/marketing-storyboard-domain/coverage/lcov.info,./packages/rpg-storyboard-domain/coverage/lcov.info

      - name: Upload test results to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('apps/cinematic-storyboard/junit.xml', 'apps/marketing-storyboard/junit.xml', 'apps/rpg-storyboard/junit.xml', 'packages/storyboard-routing/junit.xml', 'packages/storyboard-core/junit.xml', 'packages/storyboard-canvas/junit.xml', 'packages/cinematic-storyboard-domain/junit.xml', 'packages/marketing-storyboard-domain/junit.xml', 'packages/rpg-storyboard-domain/junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./apps/cinematic-storyboard/junit.xml,./apps/marketing-storyboard/junit.xml,./apps/rpg-storyboard/junit.xml,./packages/storyboard-routing/junit.xml,./packages/storyboard-core/junit.xml,./packages/storyboard-canvas/junit.xml,./packages/cinematic-storyboard-domain/junit.xml,./packages/marketing-storyboard-domain/junit.xml,./packages/rpg-storyboard-domain/junit.xml
