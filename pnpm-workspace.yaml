packages:
  - 'apps/*'
  - 'packages/*'
  - 'site'

overrides:
  fast-uri: ^3.1.2
  '@ungap/structured-clone': ^1.3.1
  # Security pins for transitive build-time deps flagged by `pnpm audit --prod`.
  devalue: ^5.8.1        # GHSA-77vg-94rm-hx3p — DoS via sparse-array deserialization
  vite: ^6.4.3           # GHSA-fx2h-pf6j-xcff — dev-server server.fs.deny bypass (also lifts site's vite 6.4.2)

onlyBuiltDependencies:
  - esbuild
  - sharp

# `pnpm audit --prod --audit-level=high` runs in CI (ci.yml). These two advisories
# are acknowledged-but-ignored because they are structurally UNREACHABLE in this
# product: storyboard-os ships as static `astro build` output (GitHub Pages) — no
# SSR server, no server islands, no request-time Host-header or slot-name handling.
# Both are only patched in astro 6 (a separate major); revisit at that bump.
auditConfig:
  ignoreGhsas:
    - GHSA-2pvr-wf23-7pc7  # astro: Host-header SSRF in prerendered error-page fetch (SSR-only)
    - GHSA-8hv8-536x-4wqp  # astro: Reflected XSS via unescaped slot name (server-islands/SSR-only)
